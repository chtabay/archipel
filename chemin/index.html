<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe4">
  <meta name="color-scheme" content="light">
  <title>Le chemin</title>
  <meta name="description" content="Un journal : chaque page devient un bout de chemin, peint à l’aquarelle. Rien ne quitte ce téléphone.">
  <link rel="stylesheet" href="style.css?v=1">
  <script type="module" src="app.js?v=1"></script>
</head>
<body>
  <header class="tete">
    <h1>Le chemin</h1>
    <p class="dit" id="dit">Chaque page devient un bout de chemin.</p>
  </header>
  <section class="frise" id="frise" aria-label="Le chemin de tes pages, du plus ancien au plus récent" tabindex="0"></section>
  <p class="jour" id="jour" aria-live="polite"></p>
  <main class="ecrire">
    <label for="page" class="titre" id="titre-page">Aujourd’hui</label>
    <textarea id="page" rows="5" placeholder="Quelques lignes sur ta journée…" spellcheck="true"></textarea>
    <div class="aide" id="aide" hidden></div>
    <p class="gestes"><button type="button" class="btn" id="garder">Garder la page</button></p>
    <p class="tiny">Ta page reste sur ce téléphone. Elle est lue ici, jamais ailleurs, et seuls ses mots choisissent ce qui pousse sur le chemin.</p>
  </main>
</body>
</html>
